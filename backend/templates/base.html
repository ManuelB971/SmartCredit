{% load static %}
<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>{% block title %}Smart Crédit{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "error": "#ba1a1a",
            "surface": "#fcf8f8",
            "primary": "#006554",
            "primary-container": "#0c806b",
            "on-surface": "#1c1b1b",
            "on-surface-variant": "#3e4945",
            "surface-container-low": "#f6f3f2",
            "surface-container-lowest": "#ffffff",
            "surface-container-highest": "#e5e2e1",
            "outline-variant": "#bdc9c4",
            "primary-fixed-dim": "#78d8bf"
          },
          fontFamily: {
            "headline": ["Inter"],
            "body": ["Inter"],
            "label": ["Inter"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { min-height: max(884px, 100dvh); font-family: 'Inter', sans-serif; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col antialiased" {% block body_attrs %}{% endblock %}>
  <header class="bg-[#fcf8f8] dark:bg-[#1c1b1b] docked full-width top-0 z-50">
    <div class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
      <a href="/" class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[#006554] dark:text-[#0c806b]" style="font-variation-settings: 'FILL' 1;">account_balance</span>
        <h1 class="text-xl font-bold text-[#006554] dark:text-[#0c806b] tracking-tighter">Smart Crédit</h1>
      </a>
      <div id="header-guest-actions" class="flex items-center gap-3">
        <a href="/connexion/" class="text-[#3e4945] dark:text-[#bdc9c4] hover:bg-[#f6f3f2] dark:hover:bg-[#2a2928] transition-colors px-4 py-2 rounded-lg font-medium">Connexion</a>
        <a href="/inscription/" class="bg-primary text-white px-4 py-2 rounded-lg font-medium hover:opacity-90 transition-opacity">Création de compte</a>
      </div>
      <div id="header-user-actions" class="hidden relative">
        <button id="header-auth-toggle" type="button" aria-expanded="false" class="flex items-center gap-2 text-[#3e4945] px-3 py-2 rounded-lg hover:bg-[#f6f3f2] transition-colors">
          <span class="material-symbols-outlined text-primary">account_circle</span>
          <span id="header-user-email" class="max-w-[220px] truncate font-medium">Mon profil</span>
          <span class="material-symbols-outlined text-sm">expand_more</span>
        </button>
        <div id="header-auth-menu" class="hidden absolute right-0 top-12 w-56 bg-white border border-outline-variant/20 rounded-xl shadow-[0_12px_24px_rgba(0,0,0,0.08)] p-2">
          <a href="/simulation/historique/" class="block w-full text-left px-3 py-2 rounded-lg hover:bg-surface-container-low text-on-surface">Historique des simulations</a>
          <button id="header-logout-btn" type="button" class="w-full text-left px-3 py-2 rounded-lg hover:bg-surface-container-low text-on-surface">Se deconnecter</button>
          <button id="header-delete-btn" type="button" class="w-full text-left px-3 py-2 rounded-lg hover:bg-red-50 text-error">Supprimer mon compte</button>
        </div>
      </div>
    </div>
  </header>
  {% block content %}{% endblock %}
  {% block bottom_nav %}{% endblock %}
  <script src="{% static 'js/api_client.js' %}"></script>
  <script src="{% static 'js/header_auth.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
